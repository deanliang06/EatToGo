services:
  redis:
    image: redis:latest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "8080:6379"

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"
  
  api:
    build: .
    command: >
      /bin/sh -c "python3 manage.py migrate &&
      python3 manage.py runserver 0.0.0.0:8000 --noreload"
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy


  worker1:
    build: .
    command:
      - /bin/sh
      - -c
      - >
        Xvfb :99 -screen 0 3840x2160x24 -ac -nolisten tcp &
        while [ ! -S /tmp/.X11-unix/X99 ]; do sleep 0.1; done;
        touch /tmp/eattogo.Xauthority;
        export DISPLAY=:99 XAUTHORITY=/tmp/eattogo.Xauthority;
        exec celery -A eatAPI worker --loglevel=info --concurrency=1
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    
    shm_size: "1gb"
    volumes:
      - ./debug:/debug
